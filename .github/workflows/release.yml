name: Upload Release Asset
on:
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    env:
      BUILD_TYPE: release
      VERSION_TYPE: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read Properties
        id: "properties"
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: 'gradle.properties'
          properties: 'mod_id mod_name java_version mod_version'

      - name: Setup Java ${{ steps.properties.outputs.java_version }}
        uses: actions/setup-java@v3.6.0
        with:
          distribution: zulu
          java-version: ${{ steps.properties.outputs.java_version }}

      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v4.3.1

      - name: Build
        run: ./gradlew build

      - name: Get Version
        id: version
        run: |
          MESSAGE=$(ls build/libs/* | awk -F '${{ steps.properties.outputs.mod_id }}-neoforge-|.jar' '{print $2}')
          echo "version=$MESSAGE" >> $GITHUB_OUTPUT

      - name: capture build artifacts
        uses: actions/upload-artifact@v4.3.3
        with:
          name: "${{ steps.properties.outputs.mod_name }} ${{ steps.version.outputs.version }}"
          path: build/libs/${{ steps.properties.outputs.mod_id }}-neoforge-${{ steps.version.outputs.version }}.jar

      - name: Upload Release Jar
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/${{ steps.properties.outputs.mod_id }}-neoforge-${{ steps.version.outputs.version }}.jar     

      - name: Publish Mod
        uses: Kira-NT/mc-publish@v3.3.1
        continue-on-error: true
        with:
          name: "${{ steps.properties.outputs.mod_name }} For NeoForge v${{ steps.version.outputs.version }}"
          version: ${{ steps.version.outputs.version }}
          version-type: ${{ env.VERSION_TYPE }}
          java: ${{ steps.properties.outputs.java_version }}
          fail-mode: skip
          changelog: test version

          modrinth-id: eiTdyr9r
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 1749629
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}